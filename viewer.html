<style>
  :root {
    --brand-600:#0ea5e9; --brand-500:#14b8a6; --brand-50:rgba(15,23,42,.04);
    --line:rgba(15,23,42,.10); --ink:#1e293b; --muted:#64748b;
    --panel:rgba(255,255,255,.72); --panel-2:rgba(248,250,252,.9); --bg-deep:#eef2f7;
  }
  * { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; }
  body {
    background:
      radial-gradient(1100px 480px at 12% -10%, rgba(14,165,233,.08), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(20,184,166,.08), transparent 55%),
      linear-gradient(180deg, #f5f7fa, var(--bg-deep) 60%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border:1px solid var(--line);
    border-radius:1.1rem;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 12px 30px -16px rgba(15,23,42,.18);
  }
  .live-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.25); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .kpi-card{
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .kpi-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background: var(--accent, var(--brand-500)); opacity:.9;
  }
  .kpi-card:hover{ box-shadow:0 10px 28px -12px rgba(15,23,42,.22); transform:translateY(-2px); border-color:rgba(15,23,42,.18); }
  .donut{ width:58px;height:58px;border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,.08), 0 0 0 5px rgba(15,23,42,.02); }
  .donut-inner{ width:44px;height:44px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center; box-shadow:0 1px 3px rgba(15,23,42,.15); }
  .donut-val{ font-size:12px;font-weight:800; color:var(--ink); }
  .lesson-row{ display:flex; align-items:center; gap:.6rem; padding:.5rem .75rem; border-bottom:1px solid var(--line); color:var(--ink); }
  .filter-select{
    display:block; margin-top:.15rem; font-size:.8rem; border:1px solid var(--line);
    border-radius:999px; padding:.45rem .9rem; background:rgba(15,23,42,.03); color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease; outline:none;
  }
  .filter-select:hover{ border-color:rgba(15,23,42,.25); }
  .filter-select:focus{ border-color:var(--brand-500); box-shadow:0 0 0 3px rgba(20,184,166,.25); }
  .week-tab{
    font-size:.72rem; font-weight:700; padding:.4rem .85rem; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); background:rgba(15,23,42,.03); cursor:pointer;
    transition:all .15s ease;
  }
  .week-tab:hover{ border-color:rgba(15,23,42,.25); color:var(--ink); }
  .week-tab.active{ background:var(--brand-500); border-color:var(--brand-500); color:#022c22; box-shadow:0 4px 14px -4px rgba(20,184,166,.55); }
  .badge{ display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.6875rem;font-weight:600; }
  .badge-green{ background:rgba(22,163,74,.12);color:#15803d; }
  .badge-amber{ background:rgba(217,119,6,.12);color:#b45309; }
  .badge-slate{ background:rgba(15,23,42,.08);color:#475569; }
  .badge-red{ background:rgba(220,38,38,.12);color:#b91c1c; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(15,23,42,.18); border-radius:8px; }

  /* Big KPI gauge (redesign) */
  .kpi-gauge-wrap{ display:flex; align-items:center; gap:1.25rem; }
  .kpi-gauge{
    width:120px; height:120px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: conic-gradient(var(--brand-600) calc(var(--gauge-pct,0)*1%), rgba(15,23,42,.08) 0);
    box-shadow: inset 0 0 0 1px rgba(15,23,42,.05);
  }
  .kpi-gauge-inner{
    width:96px; height:96px; border-radius:50%; background: var(--panel-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px rgba(15,23,42,.05);
  }
  .kpi-gauge-label{ font-size:.62rem; font-weight:800; letter-spacing:.12em; color:var(--muted); }
  .kpi-gauge-value{ font-size:1.85rem; font-weight:800; color:var(--ink); line-height:1; margin-top:2px; }
  header{ background: rgba(255,255,255,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
  #trend-table table{ color:var(--ink); }
  #kpi-detail-modal .bg-white{ background:#ffffff !important; color:var(--ink); }

  /* Right profile panel (redesign) */
  .profile-panel{
    width:100%;
    max-width:100%;
    background: linear-gradient(180deg, rgba(15,23,42,.02), transparent);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:2rem 1.25rem 3rem;
    position:relative;
  }
  @media (min-width:1024px){
    .profile-panel{ width:300px; flex-shrink:0; }
  }
  .profile-photo-wrap{
    width:200px; height:220px; border-radius:1.25rem;
    display:flex; align-items:center; justify-content:center;
    background: rgba(15,23,42,.04);
    box-shadow: inset 0 0 0 1px rgba(15,23,42,.08);
    position:relative;
  }
  .profile-photo-inner{
    width:100%; height:100%; border-radius:1.25rem; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .profile-photo{ width:100%; height:100%; object-fit:cover; }
  .profile-photo-fallback{ font-size:4.5rem; color:rgba(15,23,42,.18); }
  .profile-number{
    position:absolute; right:-.6rem; bottom:-.6rem; z-index:3;
    min-width:2.75rem; height:2.75rem; padding:0 .5rem;
    display:flex; align-items:center; justify-content:center;
    border-radius:999px; background:var(--brand-500); color:#022c22;
    font-size:1.05rem; font-weight:900; line-height:1;
    box-shadow:0 4px 12px -2px rgba(15,23,42,.35), 0 0 0 4px var(--panel);
    white-space:nowrap;
  }
  .profile-name-block{ margin-top:1.1rem; position:relative; text-align:center; z-index:2; }
  .profile-name{
    font-size:1.35rem; font-weight:900;
    letter-spacing:.02em; color:var(--ink); line-height:1.25;
  }
  .profile-role{
    margin-top:.35rem; font-size:.72rem; font-weight:700;
    letter-spacing:.04em; color:var(--muted); text-transform:uppercase;
  }

  /* ====================== MEETING / PRESENTATION MODE ====================== */
  body.present-mode{
    zoom: 1.12;
  }
  body.present-mode header{
    padding-top:.25rem; padding-bottom:.25rem;
  }
  /* Roomier, higher-contrast cards so numbers read from the back of a room */
  body.present-mode .card{
    border-width:1.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25), 0 18px 46px -18px rgba(0,0,0,.65);
  }
  body.present-mode .kpi-card{ padding:1.1rem 1.15rem !important; }
  body.present-mode .kpi-gauge-value{ font-size:2.35rem; }
  body.present-mode .kpi-gauge{ width:140px; height:140px; }
  body.present-mode .kpi-gauge-inner{ width:112px; height:112px; }
  body.present-mode .donut{ width:68px; height:68px; }
  body.present-mode .donut-inner{ width:52px; height:52px; }
  body.present-mode .donut-val{ font-size:14px; }
  body.present-mode .profile-number{ font-size:1.3rem; min-width:3.3rem; height:3.3rem; }
  body.present-mode .profile-name{ font-size:1.6rem; }

  /* Smoother entrance so the dashboard doesn't just "pop" when screen-shared */
  .card{ animation: kpiFadeIn .5s ease both; }
  @keyframes kpiFadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  /* Subtle glow/lift on KPI numbers for legibility on projectors */
  .kpi-gauge-value, .donut-val{ text-shadow:0 1px 3px rgba(0,0,0,.4); }

  /* Nicer scrollbars everywhere, not just default */
  ::-webkit-scrollbar-track{ background:transparent; }

  /* Floating "Present" toggle button */
  #present-toggle-btn{
    position:fixed; right:18px; bottom:18px; z-index:50;
    display:flex; align-items:center; gap:.5rem;
    padding:.65rem 1.1rem; border-radius:999px;
    background: linear-gradient(135deg, var(--brand-500), #16a34a);
    color:#04240f; font-weight:800; font-size:.8rem;
    box-shadow: 0 10px 30px -8px rgba(34,197,94,.6);
    border:none; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease;
  }
  #present-toggle-btn:hover{ transform:translateY(-2px); box-shadow:0 14px 34px -8px rgba(34,197,94,.75); }
  #present-toggle-btn.active{ background: linear-gradient(135deg,#f59e0b,#ea580c); color:#2a1400; box-shadow:0 10px 30px -8px rgba(245,158,11,.6); }
  @media print{ #present-toggle-btn{ display:none; } }
</style>

  const deleted = state.deletedModuleIds || [];

  const customLessons = state.customLessons || {};
  const moduleFieldOverrides = state.moduleOverrides || {};

  MODULES = base.filter(m=>!deleted.includes(m.id)).concat(custom).map(m=>{

    const modDeleted = deletedLessons[m.id] || [];
    const modCustomLessons = Array.isArray(customLessons[m.id]) ? customLessons[m.id] : [];
    const baseLessons = lessonsArray(m.lessons).filter((l,idx)=>!modDeleted.includes(idx));

/* ---------- Week: Senin–Minggu (training Selasa, Rabu, Jumat). Week 1 mulai dari tgl 1
   kalau tgl 1 jatuh hari Senin/Selasa. Kalau tgl 1 jatuh Rabu/Kamis/Jumat/Sabtu/Minggu,
   hari-hari itu ikut Week terakhir bulan sebelumnya, dan Week 1 bulan ini baru mulai
   dari Senin berikutnya. Setiap week berakhir di hari Minggu. ---------- */
function getMonthWeekRanges(year, monthIndex){
  // monthIndex: 0=Jan ... 11=Dec
  // Aturan (training Selasa, Rabu, Jumat): minggu Senin–Minggu "dimiliki" bulan tempat hari Selasanya jatuh.
  //  - tgl 1 = Senin / Selasa  -> Week 1 mulai tgl 1 (minggu tsb sudah masuk bulan ini)
  //  - tgl 1 = Rabu s/d Minggu -> tgl 1 sampai sebelum Senin pertama ikut Week TERAKHIR bulan sebelumnya,
  //                               Week 1 baru mulai di Senin pertama.
  const daysInMonth = new Date(year, monthIndex+1, 0).getDate();
  const day1Weekday = new Date(year, monthIndex, 1).getDay(); // 0=Minggu..6=Sabtu
  let start = 1;
  if(day1Weekday !== 1 && day1Weekday !== 2){
    for(let d=2; d<=8; d++){
      if(new Date(year, monthIndex, d).getDay() === 1){ start = d; break; }
    }
  }
  const ranges = {};
  let w = 1;
  while(start <= daysInMonth){
    const dow = new Date(year, monthIndex, start).getDay();
    // tiap week berakhir di hari Minggu (atau akhir bulan kalau bulan habis duluan)
    const end = Math.min(start + ((7 - dow) % 7), daysInMonth);
    ranges[w] = [start, end];
    start = end + 1;
    w++;
  }
  return ranges; // tgl sebelum Week 1 sengaja tidak ada di objek ini (lihat resolveWeekPeriod)
}
function resolveWeekPeriod(year, monthIndex, day){
  const d = Number(day);
  const ranges = getMonthWeekRanges(year, monthIndex);
  const firstRange = ranges[1];
  if(firstRange && d < firstRange[0]){
    let prevMonth = monthIndex - 1, prevYear = year;
    if(prevMonth < 0){ prevMonth = 11; prevYear -= 1; }
    const prevRanges = getMonthWeekRanges(prevYear, prevMonth);
    const prevWeeks = Object.keys(prevRanges).map(Number);
    const lastWeek = prevWeeks.length ? Math.max(...prevWeeks) : 1;
    return { year: prevYear, month: prevMonth, week: lastWeek };
  }
  for(const w in ranges){
    const [a,b] = ranges[w];
    if(d>=a && d<=b) return { year, month: monthIndex, week: parseInt(w,10) };
  }
  const weeks = Object.keys(ranges).map(Number);
  const lastWeek = weeks.length ? Math.max(...weeks) : 1;
  return { year, month: monthIndex, week: lastWeek };
}
function weekNumberFromDate(day, monthIndex, year){
  return resolveWeekPeriod(year, monthIndex, day).week;
}
function weekNumberFromDay(day, monthIndex, year){
  const now = new Date();
  const mm = (monthIndex===undefined || monthIndex===null) ? now.getMonth() : monthIndex;
  const yy = (year===undefined || year===null) ? now.getFullYear() : year;
  return weekNumberFromDate(day, mm, yy);
}
function weekDayRange(w, monthIndex, year){
  const now = new Date();
  const mm = (monthIndex===undefined || monthIndex===null) ? now.getMonth() : monthIndex;
  const yy = (year===undefined || year===null) ? now.getFullYear() : year;
  const ranges = getMonthWeekRanges(yy, mm);
  return ranges[w] || [1, 0];
}
function buildWeekRangeLabels(monthIndex, year){
  const ranges = getMonthWeekRanges(year, monthIndex);
  const out = {};
  for(let w=1; w<=5; w++){
    out[w] = ranges[w] ? ('tgl ' + ranges[w][0] + '–' + ranges[w][1]) : '—';
  }
  return out;
}
function dateInWeek(dateStr, w){
  if(!w || !dateStr) return true;
  const parts = String(dateStr).split('-');
  const yy = parseInt(parts[0],10), mm = parseInt(parts[1],10)-1, day = parseInt(parts[2],10);
  if(isNaN(day)) return true;
  const [a,b] = weekDayRange(w, isNaN(mm)?undefined:mm, isNaN(yy)?undefined:yy);
  return day>=a && day<=b;
}
function weekFromDateStr(dateStr){
  if(!dateStr) return 0;
  const parts = String(dateStr).split('-');
  const yy = parseInt(parts[0],10), mm = parseInt(parts[1],10)-1, day = parseInt(parts[2],10);
  if(isNaN(day)) return 0;
  return weekNumberFromDay(day, isNaN(mm)?undefined:mm, isNaN(yy)?undefined:yy) || 0;
}
function participantWeekBatch(p){
  const b = String(p.batch||'').trim();
  let m = b.match(/batch\s*([1-5])\b/i);
  if(!m) m = b.match(/^([1-5])$/);
  if(m) return parseInt(m[1],10);

    if(!isNaN(day)) return weekNumberFromDay(day, isNaN(mm)?undefined:mm, isNaN(yy)?undefined:yy);
  }
  return 0;
}

function getClosingSkillData(participant, mod){
  const prog = participant.progress ? participant.progress[mod.id] : null;
  const preScore = prog && typeof prog.preRoleplayScore === 'number' ? prog.preRoleplayScore : null;
  const postScore = prog && typeof prog.postRoleplayScore === 'number' ? prog.postRoleplayScore : null;
  let avg = null;
  if(preScore!==null && postScore!==null) avg = Math.round((preScore+postScore)/2);
  else if(preScore!==null) avg = preScore;
  else if(postScore!==null) avg = postScore;
  // Growth ditentukan dari PERBANDINGAN Post vs Pre (bukan lagi dari nilai rata-rata):
  //   Post > Pre  -> 'growth' | Post = Pre -> 'tetap' | Post < Pre -> 'belum' (tidak growth).
  // Perlu kedua nilai terisi; kalau salah satu masih kosong, status null (Belum Dinilai).
  const delta = (preScore!==null && postScore!==null) ? (postScore - preScore) : null;
  const status = delta===null ? null : (delta>0 ? 'growth' : (delta<0 ? 'belum' : 'tetap'));
  return { preScore, postScore, avg, status, delta };
}

// Hitung Total / Done / Belum / % Task per baris tasklist. Total default 7 task.
// Data lama yang belum punya doneTask: Done diturunkan dari % Task (43% dari 7 = 3).
function tmCounts(t){
  const total = Number(t.totalTask)>0 ? Math.round(Number(t.totalTask)) : 7;
  let done;
  if(t.doneTask!==undefined && t.doneTask!==null && t.doneTask!=='') done = Number(t.doneTask)||0;
  else done = Math.round(((Number(t.pctTask)||0)/100)*total);
  done = Math.max(0, Math.min(total, Math.round(done)));
  return { total, done, belum: total-done, pct: total>0 ? Math.round((done/total)*100) : 0 };
}
/** Persentase pengerjaan per orang = total task Done dibagi total task (default 7 per baris tasklist),
    lalu dirata-rata antar orang untuk persentase keseluruhan. */
function computeApplyPctByPeople(taskList){
  const list = taskList || [];
  const byPerson = {};
  list.forEach(t=>{
    const key = String(t.employeeName || t.employee || t.nama || t.pic || '(Tanpa nama)').trim().toLowerCase() || '(tanpa nama)';
    if(!byPerson[key]) byPerson[key] = [];
    byPerson[key].push(t);
  });
  const personKeys = Object.keys(byPerson);
  let totalUnits = 0, doneUnits = 0;
  const personAvgs = personKeys.map(k=>{
    let pt = 0, pd = 0;
    byPerson[k].forEach(t=>{ const c = tmCounts(t); pt += c.total; pd += c.done; });
    totalUnits += pt; doneUnits += pd;
    return pt>0 ? Math.round((pd/pt)*100) : 0;
  });
  const pct = personAvgs.length ? Math.round(personAvgs.reduce((a,b)=>a+b,0)/personAvgs.length) : 0;
  return { total: totalUnits, done: doneUnits, pct, people: personKeys.length, personAvgs };
}
function computeFeedbackTLStats(list){
  const total = list.length;
  const done = list.filter(f=>f.status==='done').length;
  const pct = total>0 ? Math.round((done/total)*100) : 0;
  return { total, done, pct };
}
function computeSupportCoachingStats(list){
  const total = list.length;
  const done = list.filter(f=>f.status==='done').length;
  const pct = total>0 ? Math.round((done/total)*100) : 0;
  const sumTarget = Math.min(100, Math.round(list.reduce((s,f)=>s+(Number(f.target)||0),0)));
  const sumActual = Math.min(100, Math.round(list.reduce((s,f)=>s+(Number(f.actual)||0),0)));
  return { total, done, pct, avgTarget: sumTarget, avgActual: sumActual };
}

function agendaStatusKey(e){

  if(explicit==='selesai' || explicit==='tunda') return explicit;

// ---- Plan vs Aktual kegiatan agenda ----
// Plan   = jadwal rencana kegiatan (e.date + e.time).
// Aktual = kapan kegiatan benar-benar dilaksanakan, disimpan di state.agendaActual[key] = { date, time }
//          (key sama dengan agendaStatusKey). Kalau kegiatan sudah berstatus Selesai tapi belum ada aktual
//          tercatat (mis. auto-selesai H+1), aktual dianggap sesuai plan dan ditandai "otomatis".
function agendaFmtPlanActual(dateStr, timeStr){
  const AGENDA_DOW_SHORT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  if(!dateStr) return '-';
  const dt = new Date(dateStr+'T00:00:00');
  if(isNaN(dt)) return '-';
  return AGENDA_DOW_SHORT[dt.getDay()]+', '+dt.getDate()+' '+MONTH_NAMES_ID[dt.getMonth()].slice(0,3)+(timeStr?(' · '+timeStr):'');
}
function getAgendaActual(e){
  const saved = (state.agendaActual||{})[agendaStatusKey(e)];
  if(saved && saved.date) return { date:saved.date, time:saved.time||'', auto:false };
  if(getAgendaEffectiveStatus(e)==='selesai') return { date:e.date, time:e.time||'', auto:true };
  return null;
}
function agendaActualDiff(e, actual){
  if(!actual || !e.date) return null;
  const days = Math.round((new Date(actual.date+'T00:00:00') - new Date(e.date+'T00:00:00')) / 86400000);
  if(days>0) return { label:'Mundur '+days+' hari', color:'#b45309', bg:'#fef3c7' };
  if(days<0) return { label:'Maju '+(-days)+' hari', color:'#1d4ed8', bg:'#dbeafe' };
  if(e.time && actual.time && e.time!==actual.time){
    const toMin = t=>{ const p=String(t).split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); };
    const m = toMin(actual.time) - toMin(e.time);
    if(m>0) return { label:'Telat '+m+' mnt', color:'#b45309', bg:'#fef3c7' };
    if(m<0) return { label:'Lebih awal '+(-m)+' mnt', color:'#1d4ed8', bg:'#dbeafe' };
  }
  return { label:'Sesuai plan', color:'#15803d', bg:'#dcfce7' };
}
function agendaActualLineHtml(e){
  const a = getAgendaActual(e);
  if(!a) return '<span class="">Aktual: belum dilaksanakan</span>';
  const d = agendaActualDiff(e, a);
  return '<span style="color:#15803d;font-weight:700">Aktual: '+escapeHtml(agendaFmtPlanActual(a.date, a.time))+'</span>'
    + (d ? ' <span class="badge" style="background:'+d.bg+';color:'+d.color+'">'+d.label+'</span>' : '');
}
function getWajibOccurrencesForMonth(year, month){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const list = [];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = toYMD(new Date(year, month, d));
    getRecurringOccurrencesForDate(dateStr).forEach(e=>{
      if(e.wajib===false) return;
      list.push(e);
    });
  }
  return list.sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : a.date.localeCompare(b.date));
}
function computeRecurringMonthlyCompletionWajib(year, month){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let total = 0, done = 0;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = toYMD(new Date(year, month, d));
    getRecurringOccurrencesForDate(dateStr).forEach(e=>{
      if(e.wajib===false) return;
      total++;
      if(getAgendaEffectiveStatus(e)==='selesai') done++;
    });
  }
  const pct = total>0 ? Math.round((done/total)*100) : 0;
  return { total, done, pct };
}

/* ---------- 8 indikator (sama dengan renderResumeKpi di D) ---------- */
function computeKpis(week){
  const { month: agendaMonth, year: agendaYear } = dashboardMonthYear();
  const blnName = MONTH_NAMES_ID[agendaMonth];
  const tahunNum = agendaYear;
  const weekTag = week ? ' · W'+week : '';

  let scoped = getFilteredParticipants();
  if(week) scoped = scoped.filter(p=>participantWeekBatch(p)===week);

  // 1) Peserta lulus
  const totalPeserta = scoped.length;
  const selesaiPeserta = scoped.filter(p=>overallProgressPct(p)===100).length;
  const trainingPct = totalPeserta ? Math.round((selesaiPeserta/totalPeserta)*100) : 0;

  // 2) Dampak / booking GCI
  const monthKey = dashboardGciMonthKey();
  const monthLabel = monthKey ? gciMonthLabel(monthKey) : 'Semua Bulan';
  let gciRows = (gciData||[]).slice();
  if(monthKey) gciRows = gciRows.filter(r=>gciMonthKey(r.tanggal)===monthKey);
  if(week) gciRows = gciRows.filter(r=>{ const wk = weekFromDateStr(r.tanggal); return wk>=1 && wk<=week; }); // kumulatif W1..Wn
  // Dampak = sales aktif yang jualan (>=1 booking) / total sales aktif. Tanpa filter week = global.
  const impStat = impactSalesStats(gciRows);
  const gciTotal = impStat.total;
  const bookingCount = impStat.soldCount;
  const bookingPct = impStat.pct;

  // 3) Agenda wajib
  let agendaStats = computeRecurringMonthlyCompletionWajib(agendaYear, agendaMonth);
  if(week){
    const list = getWajibOccurrencesForMonth(agendaYear, agendaMonth).filter(e=>dateInWeek(e.date, week));
    const done = list.filter(e=>getAgendaEffectiveStatus(e)==='selesai').length;
    const total = list.length;
    agendaStats = { total, done, pct: total?Math.round((done/total)*100):0 };
  }

  // 4) Skill closing
  const csMod = closingSkillModule();
  let csPct = 0, csGrowth = 0, csScored = 0;
  if(csMod){
    const csData = scoped.map(p=>getClosingSkillData(p, csMod));
    csScored = csData.filter(d=>d.status!==null).length; // dinilai = Pre & Post sudah terisi
    csGrowth = csData.filter(d=>d.status==='growth').length;
    // % Closing Skill = peserta Growth / peserta dinilai (mis. 4 dari 4 = 100%)
    csPct = csScored ? Math.round((csGrowth/csScored)*100) : 0;
  }

  // 5) Feedback ditindaklanjuti
  let fbList = state.feedbackTL.filter(f=> f.bln===blnName && Number(f.tahun)===Number(tahunNum));
  if(week) fbList = fbList.filter(f=>Number(f.week)===week);
  const fltlStats = computeFeedbackTLStats(fbList);

  // 6) Support coaching
  let scList = state.supportCoaching.filter(f=> f.bln===blnName && Number(f.tahun)===Number(tahunNum));
  if(week) scList = scList.filter(f=>Number(f.week)===week);
  const scStats = computeSupportCoachingStats(scList);

  // 7) Tasklist marketing
  let tmList = (state.tasklistMarketing.tasks||[]).filter(t=>
    monthNameFromDate(t.tanggal)===blnName && yearFromDate(t.tanggal)===String(tahunNum)
  );
  if(week) tmList = tmList.filter(t=>dateInWeek(t.tanggal, week));
  const tmStats = computeApplyPctByPeople(tmList);

  // 8) Laporan lengkap
  const indikatorValues = [trainingPct, bookingPct, agendaStats.pct, csPct, fltlStats.pct, scStats.pct, tmStats.pct];
  const indikatorTerisi = indikatorValues.filter(v=>v>0).length;
  const lengkapPct = Math.round((indikatorTerisi/indikatorValues.length)*100);

  return {
    agenda: agendaStats.pct, training: trainingPct, closing: csPct,
    apply: tmStats.pct, impact: bookingPct, lengkap: lengkapPct,
    fltl: fltlStats.pct, sc: scStats.pct,
    weekTag,
    sub: {
      agenda: `${agendaStats.done} dari ${agendaStats.total} kegiatan wajib (${blnName} ${agendaYear}${weekTag})`,
      training: `${selesaiPeserta} dari ${totalPeserta} peserta${weekTag}`,
      closing: csMod ? `${csGrowth} growth dari ${csScored} peserta dinilai${weekTag}` : 'Modul Teknik Closing belum ditemukan',
      apply: `${tmStats.people} orang · avg pengerjaan ${tmStats.pct}% · ${tmStats.done}/${tmStats.total} task (${blnName} ${tahunNum}${weekTag})`,
      impact: gciTotal ? `${bookingCount} dari ${gciTotal} sales aktif jualan (${monthLabel}${weekTag})` : 'Belum ada data Sales Aktif',
      lengkap: `${indikatorTerisi} dari ${indikatorValues.length} indikator terisi`,
      fltl: `${fltlStats.done} dari ${fltlStats.total} point selesai (${blnName} ${tahunNum}${weekTag})`,
      sc: `${scStats.done} dari ${scStats.total} sesi done (${blnName} ${tahunNum}${weekTag})`
    },
    counts: { agenda: agendaStats.total, parts: totalPeserta, tasks: tmStats.total }
  };
}

/* ---------- Tren mingguan W1–W5 (sama dengan computeWeeklyKpiSeries di D) ---------- */
function computeWeeklyKpiSeries(){
  const { month: agendaMonth, year: agendaYear } = dashboardMonthYear();
  const blnName = MONTH_NAMES_ID[agendaMonth];
  const tahunNum = agendaYear;
  const monthKey = filterBln && filterTahun
    ? (filterTahun + '-' + String(MONTH_NAMES_ID.indexOf(filterBln)+1).padStart(2,'0'))
    : (String(agendaYear) + '-' + String(agendaMonth+1).padStart(2,'0'));

  const allPeserta = getFilteredParticipants();
  const csMod = closingSkillModule();
  const gciMonthRows = (gciData||[]).filter(r=>gciMonthKey(r.tanggal)===monthKey);
  const wajibList = getWajibOccurrencesForMonth(agendaYear, agendaMonth);
  const tasks = (state.tasklistMarketing.tasks||[]).filter(t=>
    monthNameFromDate(t.tanggal)===blnName && yearFromDate(t.tanggal)===String(tahunNum)
  );
  const feedbacks = state.feedbackTL.filter(f=>f.bln===blnName && Number(f.tahun)===Number(tahunNum));
  const coachings = state.supportCoaching.filter(f=>f.bln===blnName && Number(f.tahun)===Number(tahunNum));

  const series = { agenda:[], training:[], closing:[], impact:[], apply:[], fltl:[], sc:[] };
  for(let w=1; w<=5; w++){
    const [d0,d1] = weekDayRange(w, agendaMonth, agendaYear);
    const inWeek = (dateStr)=>{
      if(!dateStr) return false;
      const day = parseInt(String(dateStr).split('-')[2],10);
      return !isNaN(day) && day>=d0 && day<=d1;
    };
    const ag = wajibList.filter(e=>inWeek(e.date));
    const agDone = ag.filter(e=>getAgendaEffectiveStatus(e)==='selesai').length;
    series.agenda.push(ag.length ? Math.round((agDone/ag.length)*100) : 0);

    const ps = allPeserta.filter(p=>participantWeekBatch(p)===w);
    const psDone = ps.filter(p=>overallProgressPct(p)===100).length;
    series.training.push(ps.length ? Math.round((psDone/ps.length)*100) : 0);

    let csPct = 0;
    if(csMod){
      // % Closing Skill = peserta Growth (Post > Pre) dibagi peserta yang sudah dinilai (Pre & Post terisi)
      const csRows = ps.map(p=>getClosingSkillData(p, csMod)).filter(d=>d.status!==null);
      csPct = csRows.length ? Math.round((csRows.filter(d=>d.status==='growth').length/csRows.length)*100) : 0;
    }
    series.closing.push(csPct);

    // Kumulatif: sales yang sudah jualan dari awal bulan sampai akhir week ini (tiap sales dihitung 1x)
    const gciW = gciMonthRows.filter(r=>{
      const dd = parseInt(String(r.tanggal||'').split('-')[2],10);
      return d1>=d0 && !isNaN(dd) && dd<=d1;
    });
    series.impact.push(impactSalesStats(gciW).pct);

    const tw = tasks.filter(t=>inWeek(t.tanggal));
    series.apply.push(computeApplyPctByPeople(tw).pct);

    const fw = feedbacks.filter(f=>Number(f.week)===w);
    const fd = fw.filter(f=>f.status==='done').length;
    series.fltl.push(fw.length ? Math.round((fd/fw.length)*100) : 0);

    const cw = coachings.filter(f=>Number(f.week)===w);
    const cd = cw.filter(f=>f.status==='done').length;
    series.sc.push(cw.length ? Math.round((cd/cw.length)*100) : 0);
  }
  return { series, blnName, tahunNum };
}

/* ---------- Skor KPI (identik dengan D) ---------- */
const KPI_INDICATORS = [
  { key:'agenda', label:'% Training terlaksana sesuai jadwal' },
  { key:'training', label:'% Peserta lulus evaluasi training' },
  { key:'closing', label:'% Peningkatan skill sales (closing skill)' },
  { key:'apply', label:'% Peserta menerapkan materi di lapangan' },
  { key:'impact', label:'% Training berdampak ke aktivitas sales' },
  { key:'lengkap', label:'% Laporan training lengkap' },
  { key:'fltl', label:'% Feedback training ditindaklanjuti' },
  { key:'sc', label:'% Support coaching sales di lapangan' }
];
const KPI_SHEET_DEFAULTS = {
  agenda:  { target:95,  weight:10 },
  training:{ target:85,  weight:15 },
  closing: { target:70,  weight:15 },
  apply:   { target:70,  weight:15 },
  impact:  { target:70,  weight:10 },
  lengkap: { target:100, weight:10 },
  fltl:    { target:80,  weight:10 },
  sc:      { target:90,  weight:15 }
};
function defaultKpiTiers(){
  return [ {minAchv:0, score:0}, {minAchv:70, score:1}, {minAchv:80, score:2}, {minAchv:90, score:3}, {minAchv:100, score:4} ];
}
function trimNum(n){ return (Math.round((n||0)*100)/100).toString(); }
function ensureKpiConfig(){
  if(!state.kpiConfig || typeof state.kpiConfig!=='object') state.kpiConfig = { indicators:{} };
  if(!state.kpiConfig.indicators || typeof state.kpiConfig.indicators!=='object') state.kpiConfig.indicators = {};
  if(state.kpiConfig.method !== 'proportional' && state.kpiConfig.method !== 'tiered') state.kpiConfig.method = 'proportional';
  const defaultWeight = Math.round((100/KPI_INDICATORS.length)*100)/100;
  KPI_INDICATORS.forEach(ind=>{
    const sheet = KPI_SHEET_DEFAULTS[ind.key] || null;
    const cur = state.kpiConfig.indicators[ind.key];
    if(!cur || typeof cur!=='object'){
      state.kpiConfig.indicators[ind.key] = {
        target: sheet ? sheet.target : 100,
        weight: sheet ? sheet.weight : defaultWeight,
        maxScore:4,
        tiers: defaultKpiTiers().map(t=>({...t}))
      };
    } else {
      if(typeof cur.target!=='number') cur.target = sheet ? sheet.target : 100;
      if(typeof cur.weight!=='number') cur.weight = sheet ? sheet.weight : defaultWeight;
      if(typeof cur.maxScore!=='number') cur.maxScore = 4;
      if(!Array.isArray(cur.tiers) || !cur.tiers.length) cur.tiers = defaultKpiTiers().map(t=>({...t}));
    }
  });
}
function kpiScoreForAchv(key, achv){
  ensureKpiConfig();
  const maxScore = kpiMaxScoreFor(key);
  if(state.kpiConfig.method === 'proportional'){
    return Math.max(0, Math.min(maxScore, Math.round((achv/100)*maxScore*100)/100));
  }
  const tiers = [...state.kpiConfig.indicators[key].tiers].sort((a,b)=>a.minAchv-b.minAchv);
  let score = 0;
  tiers.forEach(t=>{ if(achv >= t.minAchv) score = t.score; });
  return score;
}
function kpiMaxScoreFor(key){
  ensureKpiConfig();
  const cfg = state.kpiConfig.indicators[key];
  if(state.kpiConfig.method === 'proportional') return cfg.maxScore;
  return Math.max(0, ...cfg.tiers.map(t=>t.score));
}
function computeKpiRows(pctMap){
  ensureKpiConfig();
  return KPI_INDICATORS.map(ind=>{
    const cfg = state.kpiConfig.indicators[ind.key];
    const actual = pctMap[ind.key] || 0;
    const target = cfg.target || 0;
    const achv = target>0 ? Math.round((actual/target)*1000)/10 : (actual>0 ? 100 : 0);
    const score = kpiScoreForAchv(ind.key, achv);
    const weight = cfg.weight || 0;
    const result = Math.round(score*(weight/100)*1000)/1000;
    return { ...ind, actual, target, weight, achv, score, result, maxScore: kpiMaxScoreFor(ind.key) };
  });
}
function renderKpiScore(pctMap){
  const rows = computeKpiRows(pctMap);
  const total = rows.reduce((a,r)=>a+r.result, 0);
  const maxTotal = rows.reduce((a,r)=>a+(r.maxScore*(r.weight/100)), 0);
  const scoreEl = document.getElementById('kpi-score-label');
  const scaleEl = document.getElementById('kpi-scale-label');
  if(scoreEl) scoreEl.innerText = trimNum(total);
  if(scaleEl) scaleEl.innerText = '/ ' + trimNum(maxTotal);
  const ring = document.getElementById('kpi-gauge-ring');
  if(ring){
    const pct = maxTotal ? Math.max(0, Math.min(100, (total/maxTotal)*100)) : 0;
    ring.style.setProperty('--gauge-pct', pct.toFixed(1));
  }
}

      // Klik titik pada grafik -> buka rincian indikator tsb (asal persentasenya)
      onClick:function(evt, els, chart){
        const keys = ['agenda','training','closing','impact','apply','fltl','sc'];
        const pts = chart.getElementsAtEventForMode(evt, 'nearest', { intersect:true }, true);
        if(pts.length && keys[pts[0].datasetIndex]) openKpiDetail(keys[pts[0].datasetIndex]);
      },
      onHover:function(evt, els, chart){
        const pts = chart.getElementsAtEventForMode(evt, 'nearest', { intersect:true }, true);
        if(evt.native && evt.native.target) evt.native.target.style.cursor = pts.length ? 'pointer' : 'default';
      },
      plugins:{
        legend:{ position:'bottom', labels:{ boxWidth:10, usePointStyle:true, pointStyle:'circle', font:{ size:10, family:"'Plus Jakarta Sans'" } } },
        tooltip:{ callbacks:{
          title:function(items){ return items.length ? items[0].label + ' / Batch ' + String(items[0].label).replace('W','') : ''; },
          label:function(c){ return ' '+c.dataset.label+': '+c.parsed.y+'%'; }
        } }
      },
      scales:{
        y:{ min:0, max:100, grid:{ color:'#f1f5f9' }, ticks:{ callback:function(v){return v+'%';}, font:{ size:10 } } },
        x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } }
      }
    }
  });
}

/* ===== Dampak ke aktivitas sales (berbasis Sales Aktif) =====
   % = jumlah sales aktif yang jualan (>=1 booking) / total sales aktif.
   Dipakai per week (rows = data GCI di week tsb) maupun global (rows = seluruh periode). */
function impactSalesStats(rows){
  const norm = v=>String(v==null?'':v).trim().toLowerCase();
  const list = (typeof state!=='undefined' && state && Array.isArray(state.salesAktif)) ? state.salesAktif : [];
  const active = {};
  list.forEach(s=>{ const u = norm(s.username); if(u) active[u] = s; });
  const total = Object.keys(active).length;
  const sold = {};
  (rows||[]).forEach(r=>{
    const u = norm(r.marketing);
    if(!u || !active[u]) return;
    if(!sold[u]) sold[u] = { booking:0, leads:0 };
    if(classifyGciStatus(r)==='booking') sold[u].booking++; else sold[u].leads++;
  });
  const soldCount = Object.keys(sold).filter(u=>sold[u].booking>0).length;
  return { total, soldCount, pct: total ? Math.round((soldCount/total)*1000)/10 : 0, active, sold };
}

  const all = impactSalesStats(rows);
  const body = document.getElementById('kpi-detail-body');
  if(!all.total){
    setKpiDetailHeader('Detail Dampak ke Aktivitas Sales', 'Belum ada data Sales Aktif · '+monthLabel+'.');
    body.innerHTML = emptyMsg('Daftar Sales Aktif belum diisi di dashboard admin.');

  }
  setKpiDetailHeader('Detail Dampak ke Aktivitas Sales',
    all.soldCount+' dari '+all.total+' sales aktif sudah jualan ('+all.pct+'%) · '+monthLabel+'. Week 1–5 = Batch 1–5.');
  const byWeek = {0:[],1:[],2:[],3:[],4:[],5:[]};
  rows.forEach(r=>{
    const w = weekFromDateStr(r.tanggal);
    if(byWeek[w]) byWeek[w].push(r); else byWeek[0].push(r);
  });
  const ranges = monthKey
    ? buildWeekRangeLabels(parseInt(monthKey.split('-')[1],10)-1, parseInt(monthKey.split('-')[0],10))
    : buildWeekRangeLabels(new Date().getMonth(), new Date().getFullYear());
  body.innerHTML = [1,2,3,4,5].map(w=>{
    const items = byWeek[w]||[];
    const title = 'Week '+w+' · Batch '+w;
    const cumItems = [];
    for(let k=1;k<=w;k++) (byWeek[k]||[]).forEach(r=>cumItems.push(r));
    if(!cumItems.length) return weekEmptyBlock(title, ranges[w], 'tidak ada data');
    const st = impactSalesStats(cumItems);
    const stw = impactSalesStats(items);
    const pct = st.pct;
    const pctColor = pct>=50 ? '#15803d' : pct>=25 ? 'var(--brand-600)' : pct>=10 ? '#d97706' : '#dc2626';
    const barBg = pct>=50 ? '#16a34a' : pct>=25 ? 'var(--brand-500)' : pct>=10 ? '#f59e0b' : '#ef4444';
    const sellers = Object.keys(stw.sold).filter(u=>stw.sold[u].booking>0)
      .sort((a,b)=>stw.sold[b].booking-stw.sold[a].booking);
    const mkRows = sellers.map(u=>{
      const x = stw.sold[u];
      const nm = st.active[u].nama || st.active[u].username || u;
      return detailRow({
        lead: avatarLead('var(--brand-600)', nm), title: escapeHtml(nm),
        sub: escapeHtml(st.active[u].username||u)+' · '+x.booking+' booking · '+x.leads+' leads',
        badge: '<span class="text-xs font-extrabold" style="color:#15803d"><i class="fa-solid fa-circle-check"></i></span>'
      });
    }).join('');
    const belum = st.total - st.soldCount;
    return weekBlock({ title, meta: ranges[w]+' · minggu ini '+stw.soldCount+' ('+stw.pct+'%) · gabungan W1–W'+w+': '+st.soldCount+'/'+st.total, pct, pctText: pct+'%', pctColor,
      barW: Math.min(100,pct), barBg, headBg: pct>=50?'#f0fdf4':'#f8fafc', border: pct>=50?'#86efac':'var(--line)',
      rows: mkRows + '<p class="text-[10px]  px-3 py-2">'+belum+' sales aktif belum jualan sampai week ini</p>' });
  }).join('');
}

  const body = document.getElementById('kpi-detail-body');
  if(!list.length){ body.innerHTML = emptyMsg('Tidak ada task di periode ini.'); return; }

  list.forEach(t=>{

  });
  const ranges = buildWeekRangeLabels(month, tahunNum);
  body.innerHTML = [1,2,3,4,5].map(w=>{

    const title = 'Week '+w+' · Batch '+w;

    const wkStats = computeApplyPctByPeople(items);
    const dN = wkStats.done;
    const tot = wkStats.total;

    items.forEach(t=>{
      const key = String(t.employeeName || t.employee || t.nama || t.pic || '(Tanpa nama)').trim() || '(Tanpa nama)';
      if(!byPerson[key]) byPerson[key] = [];
      byPerson[key].push(t);
    });
    const rows = Object.keys(byPerson).map(name=>{
      const pt = byPerson[name];
      let personTot = 0, personDone = 0;
      pt.forEach(t=>{ const c = tmCounts(t); personTot += c.total; personDone += c.done; });
      const personPct = personTot>0 ? Math.round((personDone / personTot) * 100) : 0;
      const ok = personDone>=personTot;
      const lastDate = pt.map(t=>t.tanggal).filter(Boolean).sort().pop();
      const dateLabel = lastDate ? new Date(lastDate+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'}) : '—';
      return detailRow({
        bg: ok?'#f0fdf4':'#fff',
        lead: iconLead(ok?'#dcfce7':'#f1f5f9', ok?'#15803d':'#64748b', ok?'fa-circle-check':'fa-user'),
        title: escapeHtml(name), titleCls: ok?'text-emerald-800':'',
        sub: personDone+'/'+personTot+' task selesai · update terakhir '+dateLabel,
        mid: '<span class="text-xs font-bold mr-2" style="color:'+pctColorOf(personPct)+'">'+personPct+'%</span>',
        badge: ok?'<span class="badge badge-green">Selesai</span>':'<span class="badge badge-slate">Belum</span>'
      });
    }).join('');
    return weekBlock({ title, meta: ranges[w]+' · '+dN+'/'+tot+' selesai', pct, pctText: pct+'%', pctColor: pctColorOf(pct),
      barW: Math.min(100,pct), barBg: pctBarOf(pct), headBg: pct>=100?'#f0fdf4':'#f8fafc', border: pct>=100?'#86efac':'var(--line)', rows });
  }).join('');
}

/* ---------- Cloud (read-only). State DIGANTI UTUH setelah dinormalisasi, seperti
   applyRemoteWorkspaceData di D; tidak digabung dengan sisa data lama. ---------- */
function applyCloud(data){
  if(!data) return;
  if(data.state){
    if(!data.state.participants) data.state.participants = state.participants || [];
    const keepParts = state.participants;
    state = normalizeState(data.state);
    if(keepParts && keepParts.length) state.participants = keepParts;
    rebuildModules();
  }
  if(Array.isArray(data.gciData)) gciData = data.gciData;
  if(Array.isArray(data.posisiScope)) savedPosisiScope = data.posisiScope.slice();
}

FB_DOC.onSnapshot(function(snap){
  if(!snap.exists){ setStatus('Belum ada data cloud'); return; }
  applyCloud(snap.data());
  setStatus('Update · ' + new Date().toLocaleTimeString('id-ID'));
  renderAll();
}, function(err){ setStatus('Error: '+(err.message||err)); });

FB_PARTICIPANTS.onSnapshot(function(snap){
  state.participants = snap.docs.map(function(d){
    const x = d.data();
    if(!x.id) x.id = d.id;
    return x;
  });
  setStatus('Peserta live · ' + new Date().toLocaleTimeString('id-ID'));
  renderAll();
}, function(){});
